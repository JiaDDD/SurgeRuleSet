name: Update Surge Rules

on:
  schedule:
    # 每天 UTC 20:00 ≈ 北京时间 04:00
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate rules
        id: generate
        run: python scripts/generate.py
        continue-on-error: true

      - name: Read report
        id: report
        run: |
          if [ -f update_report.json ]; then
            echo "has_report=true" >> $GITHUB_OUTPUT
            python -c "
          import json
          d = json.load(open('update_report.json'))
          print(f\"success_count={len(d.get('success',[]))}\")
          print(f\"failed_count={len(d.get('failed',[]))}\")
          print(f\"proxy_count={d.get('counts',{}).get('Proxy',0)}\")
          print(f\"direct_count={d.get('counts',{}).get('Direct',0)}\")
          print(f\"reject_count={d.get('counts',{}).get('Reject',0)}\")
          " >> $GITHUB_OUTPUT

            python << 'EOF'
          import json
          d = json.load(open("update_report.json"))
          lines = []
          if d.get("success"):
              lines.append("✅ 成功源:")
              for s in d["success"]:
                  lines.append(f"· {s['name']} ({s['category']}): {s['count']}条")
          if d.get("failed"):
              lines.append("❌ 失败源:")
              for s in d["failed"]:
                  lines.append(f"· {s['name']}: {s.get('error','')[:60]}")
          counts = d.get("counts", {})
          lines.append(f"📊 Proxy:{counts.get('Proxy',0)} Direct:{counts.get('Direct',0)} Reject:{counts.get('Reject',0)}")
          open("bark_body.txt","w").write("\n".join(lines))
          EOF
          else
            echo "has_report=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f rules/*.sgmodule || true
          git add rules/ modules/ update_report.json || true
          if git diff --staged --quiet; then
            echo "无规则变化，跳过提交"
          else
            git commit -m "chore: 自动更新规则 $(date -u +%Y-%m-%d)"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

      - name: Send Bark notification
        if: always()
        env:
          BARK_KEY: pGadi289ySKMevrWohfM4D
        run: |
          TITLE="SurgeRuleSet拉取情况"
          
          if [ "${{ steps.report.outputs.has_report }}" = "true" ]; then
            if [ "${{ steps.report.outputs.failed_count }}" = "0" ]; then
              STATUS="✅ 成功"
            else
              STATUS="⚠️ 部分失败"
            fi
            BODY=$(cat bark_body.txt 2>/dev/null || echo "规则已更新")
          else
            STATUS="❌ 失败"
            BODY="规则生成失败，请检查 Actions 日志"
          fi
          
          # 用 jq 安全构建 JSON，避免换行和特殊字符导致推送失败
          jq -n \
            --arg title "$TITLE" \
            --arg body "$STATUS"$'\n'"$BODY" \
            --arg icon "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" \
            --arg group "SurgeRuleSet" \
            '{title: $title, body: $body, icon: $icon, group: $group, level: "active"}' \
          | curl -s -X POST "https://api.day.app/${BARK_KEY}" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d @-
